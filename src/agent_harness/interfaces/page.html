<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>_HomeAGENT</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#f6f6f4; --panel:#ffffff; --ink:#1b1b1b; --muted:#6b6b6b; --line:#dcdcd6; --me:#dbe9ff; --bot:#ffffff; --accent:#2457d6; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141517; --panel:#1c1d20; --ink:#ececec; --muted:#9a9a9a; --line:#2c2e33; --me:#223454; --bot:#1c1d20; --accent:#7aa2ff; --bad:#ff8a80; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  select { max-width: 46vw; }
  #meter { display: none; padding: 4px 12px; font-size: 12px; color: var(--muted); background: var(--panel); border-bottom: 1px solid var(--line); }
  #meter .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 3px; }
  #meter .bar span { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .marker { max-width: 46rem; margin: 6px auto 10px; padding-top: 6px; border-top: 1px dashed var(--line); text-align: center; color: var(--muted); font-size: 12px; }
  #banner { display: none; padding: 6px 12px; font-size: 14px; background: var(--panel); color: var(--bad); border-bottom: 1px solid var(--line); }
  #memnote { display: none; padding: 6px 12px; font-size: 13px; background: var(--panel); color: var(--muted); border-bottom: 1px solid var(--line); }
  #memnote.warn { color: var(--bad); }
  #meter details { margin-top: 4px; }
  #meter pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 30vh; overflow: auto; margin: 4px 0; font: 12px/1.4 ui-monospace, monospace; }
  main { flex: 1; display: flex; min-height: 0; position: relative; }
  #list { width: 260px; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); }
  #list button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: none; }
  #list button.active { background: var(--me); }
  #list small { display: block; color: var(--muted); }
  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 12px; }
  .turn { max-width: 46rem; margin: 0 auto 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .turn.user { background: var(--me); margin-left: auto; }
  .turn.assistant { background: var(--bot); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .err { color: var(--bad); font-size: 14px; margin-top: 4px; }
  form { display: flex; gap: 8px; padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; max-height: 30vh; }
  #doc { display: none; flex: none; width: 100%; resize: vertical; max-height: 40vh; border-width: 1px 0 0; border-radius: 0; font-size: 14px; }
  #gate { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 5; }
  #gate div { max-width: 24rem; width: 100%; }
  #gate input { width: 100%; padding: 10px; margin: 10px 0; font: inherit; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
  #menu { display: none; }
  @media (max-width: 720px) {
    #menu { display: inline-block; }
    #list { position: absolute; inset: 0 auto 0 0; z-index: 3; transform: translateX(-100%); transition: transform .15s; width: min(80vw, 300px); }
    #list.open { transform: none; box-shadow: 0 0 30px rgba(0,0,0,.35); }
  }
</style>
</head>
<body>
<div id="gate"><div>
  <h2>_HomeAGENT</h2>
  <p>Enter the access token. On the host, run <code>python harness.py token</code> to show it.</p>
  <input id="token" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="access token">
  <label><input type="checkbox" id="show"> Show token</label>
  <div id="gate-error" class="err"></div>
  <button id="gate-go" class="primary">Connect</button>
</div></div>
<header>
  <button id="menu" title="Conversations">&#9776;</button>
  <h1 id="title">New conversation</h1>
  <select id="model" title="Model"></select>
  <button id="new">New</button>
</header>
<div id="banner"></div>
<div id="memnote"></div>
<div id="meter"></div>
<main>
  <nav id="list"></nav>
  <section id="chat">
    <div id="log"></div>
    <textarea id="doc" rows="6" placeholder="Document: paste a long text here, then ask your question in the box below" spellcheck="false"></textarea>
    <form id="form">
      <button id="docmode" type="button" title="Add a document to ask a question about">Document</button>
      <textarea id="text" rows="1" placeholder="Message" enterkeyhint="send"></textarea>
      <button id="send" class="primary" type="submit">Send</button>
    </form>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const state = { token: store.get("harness_token"), conv: null, busy: false, run: 0, reader: null, docOpen: false };
const client = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? "phone" : "desktop";

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { ...(options.headers || {}),
    "Authorization": "Bearer " + state.token, "Content-Type": "application/json", "X-Client-Name": client } });
  if (res.status === 401) { showGate("That token was not accepted. Tokens are case-sensitive: tick \"Show token\" to check what you typed."); throw new Error("unauthorized"); }
  return res;
}
function showGate(message) { $("gate-error").textContent = message || ""; $("gate").style.display = "flex"; $("token").focus(); }

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function addTurn(role, text, extra) {
  const box = el("div", "turn " + role);
  const body = el("div", "", text); box.appendChild(body);
  if (extra && extra.model) box.appendChild(el("div", "meta", extra.model + (extra.truncated ? " (cut off by the reply limit)" : "")));
  if (extra && extra.failed) box.appendChild(el("div", "err", extra.failed));
  $("log").appendChild(box); scroll();
  return { box, body };
}
// The context meter, and a marker where older messages stopped being sent to the model.
function showWindow(w) {
  document.querySelectorAll("#log .marker").forEach((e) => e.remove());
  const meter = $("meter");
  if (!w) { meter.style.display = "none"; return; }
  showMemory(w.memory);
  const pct = Math.min(100, Math.round(100 * w.estimated_tokens / w.budget));
  meter.textContent = "";
  meter.appendChild(el("div", "", "Context: about " + w.estimated_tokens + " of " + w.budget + " tokens"
    + (w.dropped ? " - " + w.dropped + " earlier message" + (w.dropped === 1 ? "" : "s") + " not sent" : "")));
  if (w.sources && w.sources.length) meter.appendChild(el("div", "", "Retrieved from: " + w.sources.map((s) => s.id).join(", ")));
  if (w.derived) meter.appendChild(derivedBlock(w.derived));
  const bar = el("div", "bar"); const fill = el("span"); fill.style.width = pct + "%"; bar.appendChild(fill); meter.appendChild(bar);
  meter.style.display = "block";
  if (w.dropped > 0) {
    const first = document.querySelectorAll("#log .turn")[w.start];
    if (first) first.parentNode.insertBefore(el("div", "marker", "Earlier messages are kept, but no longer sent to the model"), first);
  }
}

// What an oversized message was turned into: the text the model saw, and where each piece came from.
// Collapsed by default; everything is set as text, never as HTML.
function derivedBlock(d) {
  const spans = d.sources || [];
  const box = el("details", "derived");
  box.appendChild(el("summary", "", "Derived context (" + d.method + " v" + d.version + ", depth " + d.depth + ", " + spans.length + " source spans)"));
  box.appendChild(el("div", "meta", "Built from your original message, which is kept unchanged. This is what the model was sent in its place:"));
  box.appendChild(el("pre", "", d.text));
  for (const s of spans) box.appendChild(el("div", "meta", "event " + s.event_id + (Array.isArray(s.char_range) ? ", chars " + s.char_range[0] + "-" + s.char_range[1] : ", range unknown")));
  return box;
}

// Memory notes: informational for a disabled switch or a fallback tier, a warning when no tier works.
function showMemory(m) {
  const box = $("memnote");
  let text = "", warn = false;
  if (m && m.state === "disabled") text = "Conversation memory is disabled in config; set memory.enabled to true.";
  else if (m && m.state === "degraded") { warn = true; text = "Conversation memory is unavailable: " + (m.error || "no retrieval tier works.") + (m.fix ? " Fix: " + m.fix : ""); }
  else if (m && (m.tier === "lexical" || m.reason || m.store_reason)) {
    const bits = [];
    if (m.tier === "lexical") bits.push("Conversation memory is using keyword search only, so recall of reworded questions is weaker (" + (m.reason || "vector tier unavailable") + ").");
    else if (m.reason) bits.push("Conversation memory note (" + m.reason + ").");
    if (m.store_reason) bits.push(m.store_reason);
    text = bits.join(" ") + (m.fix ? " Fix: " + m.fix : "");
  }
  box.textContent = text; box.className = warn ? "warn" : "";
  box.style.display = text ? "block" : "none";
}

function scroll() { const log = $("log"); log.scrollTop = log.scrollHeight; }

async function loadModels() {
  const data = await (await api("/api/models")).json();
  const status = await (await api("/api/status")).json();
  const select = $("model"); select.textContent = "";
  const down = [];
  for (const m of data.models) {
    if (!m.available) { down.push(m.backend + ": " + m.reason); continue; }
    if (!m.chat) continue;
    const opt = el("option", "", (m.choice === data.default ? "★ " : "") + m.choice);
    opt.value = m.choice; select.appendChild(opt);
  }
  const want = [store.get("harness_model"), data.default].find((c) => c && [...select.options].some((o) => o.value === c));
  if (want) select.value = want;
  showMemory(status.memory);
  $("banner").style.display = down.length ? "block" : "none";
  $("banner").textContent = down.length ? "Unavailable: " + down.join(", ") : "";
  $("send").disabled = !select.options.length;
}

async function loadList() {
  const data = await (await api("/api/conversations")).json();
  const list = $("list"); list.textContent = "";
  const free = el("button", "", "Free GPU memory");
  free.onclick = freeGpu; list.appendChild(free);
  const makeDefault = el("button", "", "Make the selected model the default");
  makeDefault.onclick = setDefault; list.appendChild(makeDefault);
  for (const c of data.conversations) {
    if (c.id === state.conv) $("title").textContent = c.title;
    const b = el("button", c.id === state.conv ? "active" : "");
    b.appendChild(el("span", "", c.title));
    b.appendChild(el("small", "", c.turns + " messages" + (c.busy ? " - answering" : "")));
    b.onclick = () => { list.classList.remove("open"); openConversation(c.id); };
    list.appendChild(b);
  }
}

async function setDefault() {
  const model = $("model").value;
  const res = await api("/api/default", { method: "POST", body: JSON.stringify({ model }) });
  const data = await res.json();
  if (res.ok) { store.set("harness_model", model); await loadModels(); }
  $("banner").textContent = res.ok ? "Default model: " + data.default + " (new devices start with it)" : data.error;
  $("banner").style.display = "block";
}

async function freeGpu() {
  const res = await api("/api/unload", { method: "POST", body: "{}" });
  const data = await res.json();
  const parts = res.ok ? Object.entries(data.unloaded).map(([b, r]) => b + ": " + (Array.isArray(r) ? (r.length ? "freed " + r.join(", ") : "nothing loaded") : r)) : [data.error];
  $("banner").textContent = parts.join(" | "); $("banner").style.display = "block";
  setTimeout(loadModels, 4000);
}

async function openConversation(id) {
  const res = await api("/api/conversations/" + id);
  if (!res.ok) { state.conv = null; store.set("harness_conv", ""); return; }  // forget one that is gone
  const conv = await res.json();
  stopFollowing();
  state.conv = id; store.set("harness_conv", id);
  $("title").textContent = conv.title;
  $("log").textContent = "";
  for (const t of conv.turns) addTurn(t.role, t.text, t.role === "assistant" ? { model: t.model, truncated: t.truncated, failed: t.failed } : null);
  showWindow(conv.window);
  setBusy(false);
  if (conv.open_generation) follow(conv.open_generation);
  loadList();
}

function setBusy(b) { state.busy = b; $("send").disabled = b || !$("model").options.length; $("text").disabled = b; $("doc").disabled = b; }

// Document + Question: compose the "document, then a final Question: line" shape that the server's overflow
// fallback reads. The server is unchanged; it only sees an ordinary message.
const MESSAGE_LIMIT = 20000;
function prepareMessage(doc, question) {
  const q = question.trim(), d = doc.replace(/\s+$/, "");
  let text = q;
  if (d.trim()) {
    if (!q) return { text: "", error: "Add a question below the document." };
    text = d + "\nQuestion: " + q;
  }
  if (text.length > MESSAGE_LIMIT)
    return { text: "", error: "That message is " + text.length.toLocaleString("en-US") + " characters; the limit is 20,000. Shorten the document." };
  return { text, error: "" };
}

async function newConversation() {
  const res = await api("/api/conversations", { method: "POST", body: "{}" });
  const { id } = await res.json();
  await openConversation(id);
  $("text").focus();
}

async function send(text, parts) {
  // A message the server did not record: say why, give the text back, and redraw from the record,
  // so the page never shows turns the conversation does not have.
  const reject = async (message) => {
    if (parts && parts.doc) $("doc").value = parts.doc;
    $("text").value = parts ? parts.question : text; setBusy(false);
    if (state.conv) { try { await openConversation(state.conv); } catch (e) { /* the server is unreachable */ } }
    $("banner").textContent = message; $("banner").style.display = "block";
  };
  try {
    if (!state.conv) await newConversation();
    addTurn("user", text);
    setBusy(true);
    const res = await api("/api/conversations/" + state.conv + "/messages", { method: "POST",
      body: JSON.stringify({ text, model: $("model").value }) });
    store.set("harness_model", $("model").value);
    const data = await res.json();
    if (!res.ok) return reject(data.error || "The message was not accepted.");
    follow(data.generation_id);
  } catch (e) {
    if (String(e.message) === "unauthorized") setBusy(false);
    else await reject("Could not reach the server: " + e.message);
  }
}

// Only one stream is followed at a time; switching conversation or reattaching supersedes the old one.
function stopFollowing() {
  state.run++;
  if (state.reader) { try { state.reader.cancel(); } catch (e) {} state.reader = null; }
}

async function follow(generationId, attempt = 0) {
  stopFollowing();
  const run = state.run;
  setBusy(true);
  const turn = addTurn("assistant", "");
  const note = el("div", "meta"); turn.box.appendChild(note);
  let finished = false;
  try {
    const res = await api("/api/generations/" + generationId + "/stream");
    if (!res.ok) throw new Error("stream " + res.status);
    const reader = res.body.getReader(); const decoder = new TextDecoder(); let buffer = "";
    state.reader = reader;
    for (;;) {
      const { value, done } = await reader.read();
      if (done || state.run !== run) break;
      buffer += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, nl).trim(); buffer = buffer.slice(nl + 1);
        if (!line) continue;
        const m = JSON.parse(line);
        if (m.type === "snapshot") { turn.body.textContent = m.text; waiting(note, m); if (m.window) showWindow(m.window); finished = finished || end(turn, note, m); }
        else if (m.type === "position") note.textContent = m.position > 0 ? "Waiting for the model (" + m.position + " ahead)" : "";
        else if (m.type === "running") { note.textContent = ""; if (m.window) showWindow(m.window); }
        else if (m.type === "progress") note.textContent = "Preparing context (" + m.completed + "/" + m.total + ")";
        else if (m.type === "reset") turn.body.textContent = "";
        else if (m.type === "delta") { turn.body.textContent += m.text; scroll(); }
        else if (m.type === "done") finished = end(turn, note, { state: "done", summary: m.summary });
        else if (m.type === "failed") finished = end(turn, note, { state: "failed", error: m.error, text: m.error.partial_text });
      }
    }
  } catch (e) { if (String(e.message) === "unauthorized") return; }
  if (state.run !== run) return;  // superseded by another conversation or stream
  if (!finished && attempt < 20) {
    turn.box.remove();
    return setTimeout(() => { if (state.run === run) follow(generationId, attempt + 1); }, 1500);
  }
  state.reader = null;
  setBusy(false); loadList(); $("text").focus();
}
function waiting(note, m) { if (m.state === "queued") note.textContent = m.position > 0 ? "Waiting for the model (" + m.position + " ahead)" : "Starting"; }
function end(turn, note, m) {
  if (m.state === "done") { note.textContent = m.summary && m.summary.stop_reason === "truncated" ? "Cut off by the reply limit" : ""; return true; }
  if (m.state === "failed") { note.textContent = ""; turn.box.appendChild(el("div", "err", m.error.reason + ": " + m.error.message)); return true; }
  return false;
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  if (state.busy) return;
  const parts = { doc: state.docOpen ? $("doc").value : "", question: $("text").value };
  const { text, error } = prepareMessage(parts.doc, parts.question);
  if (error) { $("banner").textContent = error; $("banner").style.display = "block"; return; }
  if (!text) return;
  $("text").value = ""; $("doc").value = ""; grow(); send(text, parts);
};
$("docmode").onclick = () => {
  state.docOpen = !state.docOpen;
  $("doc").style.display = state.docOpen ? "block" : "none";
  $("text").placeholder = state.docOpen ? "Your question about the document" : "Message";
  if (state.docOpen) $("doc").focus(); else $("text").focus();
};
$("text").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android|iPhone/i.test(navigator.userAgent)) { e.preventDefault(); $("form").requestSubmit(); } };
$("text").oninput = grow;
function grow() { const t = $("text"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, window.innerHeight * 0.3) + "px"; }
$("new").onclick = () => { $("list").classList.remove("open"); newConversation(); };
$("menu").onclick = () => $("list").classList.toggle("open");
$("show").onchange = () => { $("token").type = $("show").checked ? "text" : "password"; };
$("gate-go").onclick = () => { state.token = $("token").value.replace(/\s+/g, ""); store.set("harness_token", state.token); $("gate").style.display = "none"; start(); };
$("token").onkeydown = (e) => { if (e.key === "Enter") $("gate-go").click(); };

async function start() {
  try {
    await loadModels(); await loadList();
    const last = store.get("harness_conv");
    if (last) await openConversation(last);
  } catch (e) {
    if (String(e.message) !== "unauthorized") {
      $("banner").textContent = "Cannot reach the server (" + location.origin + "): " + e.message;
      $("banner").style.display = "block";
    }
  }
}
// A login link from `harness.py link` carries the token after the #, which is never sent to the server.
(function takeTokenFromLink() {
  const m = /^#token=(.+)$/.exec(location.hash);
  if (!m) return;
  state.token = decodeURIComponent(m[1]).replace(/\s+/g, ""); store.set("harness_token", state.token);
  history.replaceState(null, "", location.pathname + location.search);  // gone from the address bar and history
})();

// The page talks to the server by relative address, so it only works when loaded from the server itself.
function servedOverHttp(protocol) { return protocol === "http:" || protocol === "https:"; }
if (!servedOverHttp(location.protocol)) {
  showGate("This page was opened as a file or in a preview, so it cannot reach the server. Open the address that "
    + "`python harness.py serve` prints, for example http://<this PC>:8765/ in a browser.");
  $("token").style.display = "none"; $("gate-go").style.display = "none";
} else if (state.token) start(); else showGate("");
</script>
</body>
</html>
